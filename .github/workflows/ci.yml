name: CI

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "17 3 * * 1"

permissions:
  contents: read

jobs:
  simulator:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Python unit and contract tests
        run: python -m unittest discover -s tests -v
      - name: Deterministic experiment smoke
        run: python scripts/run_experiment.py --scenario evening --seconds 180 --seeds 2 --output /tmp/elevator-smoke.json
      - name: Destination-control smoke
        run: python scripts/run_experiment.py --scenario evening --seconds 120 --seeds 3 --control-mode destination --output /tmp/elevator-destination-smoke.json
      - name: Versioned artifact and trace validation
        run: python scripts/validate_artifacts.py
      - name: Release audit
        run: python scripts/audit_release.py

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install frontend dependencies
        run: npm ci --prefix frontend
      - name: TypeScript
        run: npm run typecheck --prefix frontend
      - name: Frontend unit tests
        run: npm test --prefix frontend
      - name: Production build into web
        run: npm run build --prefix frontend

  browser:
    runs-on: ubuntu-latest
    needs: [simulator, frontend]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - name: Install browser and frontend dependencies
        run: |
          npm ci
          npm ci --prefix frontend
          npm run build --prefix frontend
          npx playwright install --with-deps chromium
      - name: Playwright E2E, responsive and visual regression
        run: npm run test:e2e
      - name: Upload browser QA evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: m8-browser-qa
          path: |
            artifacts/
            test-results/
          if-no-files-found: warn
          retention-days: 14

  statistical-regression:
    if: github.event_name == 'push' || github.event_name == 'schedule' || contains(github.event.pull_request.labels.*.name, 'full-statistical-regression')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: M3 30-seed six-scenario evidence matrix
        run: python scripts/run_experiment.py --matrix --seconds 180 --seeds 30 --output /tmp/m3-evidence.json
      - name: M3 statistical regression baseline
        run: python scripts/check_regression_baseline.py /tmp/m3-evidence.json
      - name: Upload statistical evidence
        uses: actions/upload-artifact@v4
        with:
          name: m3-statistical-regression
          path: /tmp/m3-evidence.json
          retention-days: 14
